<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Dapur Mas Bayu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login" class="min-h-screen bg-[#f8f8f4] text-black antialiased selection:bg-yellow-300">
  <header id="site-header"></header>

  <main class="min-h-[calc(100vh-76px)] max-w-6xl mx-auto px-6 md:px-10 py-10 md:py-14 flex items-center justify-center">
    <section class="w-full max-w-4xl grid md:grid-cols-[.9fr_1.1fr] bg-white border-[3px] border-black rounded-[26px] shadow-[8px_8px_0_#000] overflow-hidden">
      <div class="bg-[#FFFF00] p-7 md:p-10 flex flex-col justify-between min-h-[260px] md:min-h-[500px] border-b-[3px] md:border-b-0 md:border-r-[3px] border-black"><div><div class="w-14 h-14 rounded-2xl bg-[#002BFF] text-white border-2 border-black flex items-center justify-center text-3xl mb-7">⌂</div><p class="text-xs font-black uppercase tracking-wider mb-3">Selamat datang</p><h1 class="text-3xl md:text-4xl font-black leading-tight">Masuk ke<br>Dapur Mas Bayu.</h1><p class="mt-4 text-sm leading-relaxed text-neutral-800">Kelola pesananmu dengan lebih mudah dalam satu tempat.</p></div><p class="text-xs font-bold text-neutral-700 mt-8">Makanan dan Cemilan pilihanmu.</p></div>
      <div class="p-7 md:p-10"><p class="text-xs font-black text-[#002BFF] uppercase tracking-wider mb-2">Akun pelanggan</p><h2 class="text-2xl md:text-3xl font-black mb-2">Login</h2><p class="text-sm text-neutral-600 mb-8">Masukkan data akun untuk melanjutkan.</p>
        <form id="login-form" class="space-y-5"><div><label for="login-email" class="block text-sm font-black mb-2">Email</label><input id="login-email" type="email" required placeholder="nama@email.com" class="w-full px-4 py-3 bg-white font-semibold brutal-input"></div><div><div class="flex items-center justify-between mb-2"><label for="login-password" class="block text-sm font-black">Kata sandi</label><a href="#" class="text-xs font-bold text-[#002BFF] hover:underline">Lupa kata sandi?</a></div><input id="login-password" type="password" required placeholder="Masukkan kata sandi" class="w-full px-4 py-3 bg-white font-semibold brutal-input"></div><label class="flex items-center gap-2 text-sm font-semibold"><input type="checkbox" class="w-4 h-4 accent-[#002BFF]"> Ingat saya</label><button type="submit" class="w-full bg-[#002BFF] text-white px-6 py-3.5 brutal-btn hover:brightness-110">Masuk ke Akun <span class="ml-1">→</span></button></form>
        <p id="login-message" class="hidden mt-4 text-sm font-bold"></p><p class="text-center text-sm text-neutral-600 mt-8">Belum punya akun? <a href="daftar.html" class="font-black text-[#002BFF] hover:underline">Daftar sekarang</a></p>
      </div>
    </section>
  </main>
  <script src="js/layout.js"></script><script src="js/api-client.js"></script><script src="js/login.js"></script>
</body>
</html>
