<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daftar Akun - Dapur Mas Bayu</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="register" class="min-h-screen bg-[#f8f8f4] text-black antialiased selection:bg-yellow-300">
  <header id="site-header"></header>
  <main class="min-h-[calc(100vh-76px)] max-w-6xl mx-auto px-6 md:px-10 py-10 md:py-14 flex items-center justify-center">
    <section class="w-full max-w-4xl grid md:grid-cols-[.9fr_1.1fr] bg-white border-[3px] border-black rounded-[26px] shadow-[8px_8px_0_#000] overflow-hidden">
      <div class="bg-[#FFFF00] p-7 md:p-10 flex flex-col justify-between min-h-[260px] md:min-h-[570px] border-b-[3px] md:border-b-0 md:border-r-[3px] border-black"><div><div class="w-14 h-14 rounded-2xl bg-[#002BFF] text-white border-2 border-black flex items-center justify-center text-3xl mb-7">✦</div><p class="text-xs font-black uppercase tracking-wider mb-3">Bergabung bersama kami</p><h1 class="text-3xl md:text-4xl font-black leading-tight">Buat akun<br>Dapur Mas Bayu.</h1><p class="mt-4 text-sm leading-relaxed text-neutral-800">Simpan informasi pesanan dan nikmati pengalaman belanja yang lebih praktis.</p></div><p class="text-xs font-bold text-neutral-700 mt-8">Makanan dan Cemilan pilihanmu.</p></div>
      <div class="p-7 md:p-10"><p class="text-xs font-black text-[#002BFF] uppercase tracking-wider mb-2">Akun pelanggan</p><h2 class="text-2xl md:text-3xl font-black mb-2">Daftar akun</h2><p class="text-sm text-neutral-600 mb-7">Lengkapi data berikut untuk membuat akun baru.</p>
        <form id="register-form" class="space-y-4"><div><label for="register-name" class="block text-sm font-black mb-2">Nama lengkap</label><input id="register-name" type="text" required placeholder="Nama lengkap" class="w-full px-4 py-3 bg-white font-semibold brutal-input"></div><div><label for="register-email" class="block text-sm font-black mb-2">Email</label><input id="register-email" type="email" required placeholder="nama@email.com" class="w-full px-4 py-3 bg-white font-semibold brutal-input"></div><div><label for="register-phone" class="block text-sm font-black mb-2">No. WhatsApp</label><input id="register-phone" type="tel" required placeholder="08xxxxxxxxxx" class="w-full px-4 py-3 bg-white font-semibold brutal-input"></div><div class="grid sm:grid-cols-2 gap-4"><div><label for="register-password" class="block text-sm font-black mb-2">Kata sandi</label><input id="register-password" type="password" required minlength="6" placeholder="Min. 6 karakter" class="w-full px-4 py-3 bg-white font-semibold brutal-input"></div><div><label for="register-confirm" class="block text-sm font-black mb-2">Ulangi kata sandi</label><input id="register-confirm" type="password" required minlength="6" placeholder="Ulangi kata sandi" class="w-full px-4 py-3 bg-white font-semibold brutal-input"></div></div><label class="flex items-start gap-2 text-sm font-semibold"><input id="register-terms" type="checkbox" required class="mt-1 w-4 h-4 accent-[#002BFF]"><span>Saya menyetujui syarat dan ketentuan yang berlaku.</span></label><button type="submit" class="w-full bg-[#002BFF] text-white px-6 py-3.5 brutal-btn hover:brightness-110">Buat Akun <span class="ml-1">→</span></button></form>
        <p id="register-message" class="hidden mt-4 text-sm font-bold"></p><p class="text-center text-sm text-neutral-600 mt-7">Sudah punya akun? <a href="login.html" class="font-black text-[#002BFF] hover:underline">Login sekarang</a></p>
      </div>
    </section>
  </main>
  <script src="js/layout.js"></script><script src="js/api-client.js"></script><script src="js/register.js"></script>
</body>
</html>
