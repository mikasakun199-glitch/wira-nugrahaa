<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dapur Mas Bayu - Katalog Produk</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="catalog" class="min-h-screen bg-white text-black antialiased selection:bg-yellow-300">
  <header id="site-header"></header>
  <main class="max-w-[1400px] mx-auto px-6 md:px-12 py-8">
    <div class="mb-8"><h1 class="text-2xl md:text-3xl font-extrabold text-[#002BFF] tracking-tight mb-1">Katalog Produk</h1><p class="text-neutral-600 text-sm font-medium">Pilih menu favoritmu, tentukan jumlahnya, lalu kirim pesanan.</p></div>
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
      <section class="lg:col-span-8 grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6" id="product-grid" aria-label="Daftar produk"></section>
      <aside class="lg:col-span-4 sticky top-24"><div class="bg-[#FFFF00] border-[3.5px] border-black rounded-[22px] shadow-[6px_6px_0px_#000000] p-6">
        <div class="flex items-center gap-2.5 pb-4 border-b-2 border-black/20"><span class="text-2xl">🛒</span><h2 class="font-black text-lg">Keranjang</h2></div>
        <div id="cart-container" class="my-5 min-h-[90px] flex flex-col justify-center"><p id="empty-cart-msg" class="text-center text-sm font-bold text-neutral-800 py-6">Keranjang masih kosong</p><ul id="cart-items-list" class="space-y-2.5 hidden"></ul><div id="cart-summary" class="hidden pt-3 border-t-2 border-black/20 mt-3"><div class="flex justify-between items-center text-sm font-bold"><span>Total Belanja:</span><span id="cart-total-price" class="text-base font-black text-[#002BFF]">Rp.0</span></div></div></div>
        <form id="order-form" class="space-y-4" onsubmit="event.preventDefault(); submitOrder();"><div><label class="block text-xs font-black mb-1.5">Nama</label><input type="text" id="cust-name" required placeholder="Nama lengkap" class="w-full px-3.5 py-2 bg-white text-sm font-semibold brutal-input"></div><div><label class="block text-xs font-black mb-1.5">No. Hp / WhatsApp</label><input type="tel" id="cust-phone" required placeholder="08xxxxxxxxxx" class="w-full px-3.5 py-2 bg-white text-sm font-semibold brutal-input"></div><div><label class="block text-xs font-black mb-1.5">Metode</label><div class="grid grid-cols-2 gap-2.5"><button type="button" id="btn-pickup" onclick="setDeliveryMethod('pickup')" class="py-2 px-3 text-xs font-black rounded-lg border-2 border-black bg-[#002BFF] text-white shadow-[2px_2px_0px_#000]">Ambil sendiri</button><button type="button" id="btn-delivery" onclick="setDeliveryMethod('delivery')" class="py-2 px-3 text-xs font-black rounded-lg border-2 border-black bg-white text-black shadow-[2px_2px_0px_#000]">Diantar</button></div></div><button type="submit" class="w-full mt-4 bg-black text-white py-3 px-4 rounded-xl border-2 border-black font-black text-sm shadow-[3px_3px_0px_rgba(0,0,0,.3)]">Kirim Pesanan →</button></form>
      </div></aside>
    </div>
  </main>
  <script src="data/products.js"></script><script src="js/layout.js"></script><script src="js/app.js"></script>
</body>
</html>
